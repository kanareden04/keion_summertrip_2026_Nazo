<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脱出成功</title>
    <style>
        /* 全体のスタイル（落ち着いたダークトーン基調＋深緑の背景） */
        body {
            background: linear-gradient(135deg, #121c14 0%, #1a2a1d 50%, #0d160e 100%);
            color: #e2ece9;
            font-family: 'Helvetica Neue', Arial, 'ヒラギノ角ゴ ProN', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* 森林・山の背景モチーフ装飾 */
        .mountain-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(74, 157, 107, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(45, 106, 79, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(45, 106, 79, 0.2) 0%, transparent 40%);
            pointer-events: none;
            z-index: 1;
        }

        /* メインカードコンテナ */
        .container {
            background: rgba(30, 45, 34, 0.85);
            backdrop-filter: blur(10px);
            padding: 48px 28px;
            border-radius: 16px;
            border: 2px solid #3d6a49;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(74, 157, 107, 0.2);
            text-align: center;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 山・森林モチーフのアイコン装飾 */
        .icon-decor {
            font-size: 40px;
            margin-bottom: 12px;
            letter-spacing: 8px;
            display: inline-block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* 「脱出成功」タイトル（ゴールド〜新緑のグラデーション） */
        h1 {
            font-size: 38px;
            margin: 0 0 24px 0;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #a8e6cf 0%, #d4af37 50%, #52c234 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(82, 194, 52, 0.3);
        }

        /* 区切り線 */
        .divider {
            height: 2px;
            background: linear-gradient(to right, transparent, #4a9d6b, #d4af37, #4a9d6b, transparent);
            border: none;
            margin: 20px auto 28px auto;
            width: 80%;
        }

        /* 文章1：バスを呼び戻し〜 */
        .message-sub {
            font-size: 16px;
            color: #cce3de;
            line-height: 1.7;
            margin-bottom: 24px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* 文章2：合宿はまだ終わっていません〜 */
        .message-main {
            font-size: 19px;
            color: #ffffff;
            line-height: 1.6;
            font-weight: bold;
            letter-spacing: 1.2px;
            background: rgba(45, 80, 55, 0.6);
            padding: 16px 14px;
            border-radius: 10px;
            border: 1px solid #4a9d6b;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* 感嘆符強調 */
        .exclamation {
            color: #ffd700;
            display: inline-block;
        }

        @media (max-width: 480px) {
            .container { padding: 36px 20px; }
            h1 { font-size: 30px; letter-spacing: 2px; }
            .message-sub { font-size: 14px; }
            .message-main { font-size: 16px; padding: 14px 10px; }
            .icon-decor { font-size: 32px; }
        }
    </style>
</head>
<body>

    <div class="mountain-bg"></div>

    <div class="container">
        <div class="icon-decor">⛰️ 🌲 🌲</div>
        
        <h1>脱出成功</h1>

        <hr class="divider">

        <p class="message-sub">
            バスを呼び戻し、無事帰宅できました。
        </p>

        <p class="message-main">
            合宿はまだ終わっていません。<br>
            もっともっと楽しもう<span class="exclamation">‼‼‼</span>
        </p>
    </div>

</body>
</html>
