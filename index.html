<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーワード入力</title>
    <style>
        /* 全体のスタイル（モノクロームベース） */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        /* メインのコンテナ */
        .container {
            background-color: #2b2b2b;
            padding: 32px 24px;
            border-radius: 12px;
            border: 2px solid #444;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .label-blue { color: #4a90e2; }
        .label-yellow { color: #f5a623; }
        .label-red { color: #e74c3c; }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #555;
            border-radius: 8px;
            background-color: #333;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        input#keywordBlue { border-left: 6px solid #4a90e2; }
        input#keywordBlue:focus { border-color: #4a90e2; }

        input#keywordYellow { border-left: 6px solid #f5a623; }
        input#keywordYellow:focus { border-color: #f5a623; }

        input#keywordRed { border-left: 6px solid #e74c3c; }
        input#keywordRed:focus { border-color: #e74c3c; }

        button {
            background: linear-gradient(to bottom, #555, #444);
            color: #fff;
            border: 2px solid #666;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background 0.3s, border-color 0.3s;
            box-sizing: border-box;
        }

        button:hover {
            background: linear-gradient(to bottom, #666, #555);
            border-color: #888;
        }

        .error-message {
            margin-top: 20px;
            padding: 12px;
            background-color: #4a4a4a;
            color: #ffffff;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }

        .video-container {
            margin-top: 20px;
            display: none;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
            position: relative;
            padding-top: 56.25%;
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 480px) {
            .container { padding: 24px 16px; }
            h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>キーワードを入力してください</h1>
        
        <div class="input-group">
            <label for="keywordBlue" class="label-blue">青のキーワード</label>
            <input type="text" id="keywordBlue" placeholder="青の言葉を入力" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="keywordYellow" class="label-yellow">黄のキーワード</label>
            <input type="text" id="keywordYellow" placeholder="黄の言葉を入力" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="keywordRed" class="label-red">赤のキーワード</label>
            <input type="text" id="keywordRed" placeholder="赤の言葉を入力" autocomplete="off">
        </div>

        <button onclick="checkKeywords()">送信</button>

        <div id="errorMessage" class="error-message"></div>

        <div id="videoContainer" class="video-container">
            <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function checkKeywords() {
            // 空白を判定に含めるため .trim() は外してそのまま取得
            const kBlue = document.getElementById('keywordBlue').value;
            const kYellow = document.getElementById('keywordYellow').value;
            const kRed = document.getElementById('keywordRed').value;

            const errorMessage = document.getElementById('errorMessage');
            const videoContainer = document.getElementById('videoContainer');
            const videoPlayer = document.getElementById('videoPlayer');

            // 表示のリセット
            errorMessage.style.display = 'none';
            videoContainer.style.display = 'none';
            videoPlayer.src = "";

            // ====== 設定部分 ======
            // 正解候補を配列で複数設定（ここに記載されているものはいずれも正解扱いになります）
            const correctBlue = ["あお そら", "あお そら", "あおそら"];    // 全角空白 / 半角空白 / 空白なし
            const correctYellow = ["きいろ とり", "きいろ とり", "きいろとり"];
            const correctRed = ["あか はな", "あか はな", "あかはな"];

            // ブラフ候補（空白入りのパターンも登録可能）
            const bluffWords = ["ダミー", "トラップ", "ひっかけ", "だみー ワード"];

            // 遷移先のURL
            const nextUrl = "quiz_page.html";

            // ブラフ動画の埋め込みURL
            const bluffVideoUrl = "https://www.youtube.com/embed/mGduopN1dSI";
            // ======================

            // 入力された文字が正解候補のいずれかに一致するか確認 (.includes を使用)
            const isBlueCorrect = correctBlue.includes(kBlue);
            const isYellowCorrect = correctYellow.includes(kYellow);
            const isRedCorrect = correctRed.includes(kRed);

            // 3つとも正解リストに含まれているか
            const isAllCorrect = isBlueCorrect && isYellowCorrect && isRedCorrect;

            // いずれかの欄にブラフワードが含まれているか
            const containsBluff = bluffWords.includes(kBlue) || bluffWords.includes(kYellow) || bluffWords.includes(kRed);

            if (isAllCorrect) {
                // 正解：ページ移動
                window.location.href = nextUrl;

            } else if (containsBluff) {
                // ブラフ：動画再生
                videoPlayer.src = bluffVideoUrl;
                videoContainer.style.display = 'block';

            } else {
                // 不正解：警告表示
                errorMessage.textContent = "キーワードが正しくありません。";
                errorMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
