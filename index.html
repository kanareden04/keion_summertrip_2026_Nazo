<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーワード入力</title>
    <style>
        /* 全体のスタイル（モノクロームベース） */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        /* メインのコンテナ */
        .container {
            background-color: #2b2b2b;
            padding: 32px 24px;
            border-radius: 12px;
            border: 2px solid #444;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .label-blue { color: #4a90e2; }
        .label-yellow { color: #f5a623; }
        .label-red { color: #e74c3c; }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #555;
            border-radius: 8px;
            background-color: #333;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        input#keywordBlue { border-left: 6px solid #4a90e2; }
        input#keywordBlue:focus { border-color: #4a90e2; }

        input#keywordYellow { border-left: 6px solid #f5a623; }
        input#keywordYellow:focus { border-color: #f5a623; }

        input#keywordRed { border-left: 6px solid #e74c3c; }
        input#keywordRed:focus { border-color: #e74c3c; }

        button {
            background: linear-gradient(to bottom, #555, #444);
            color: #fff;
            border: 2px solid #666;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background 0.3s, border-color 0.3s;
            box-sizing: border-box;
        }

        button:hover {
            background: linear-gradient(to bottom, #666, #555);
            border-color: #888;
        }

        .error-message {
            margin-top: 20px;
            padding: 12px;
            background-color: #4a4a4a;
            color: #ffffff;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }

        /* 画面全体を覆う動画モーダル（オーバーレイ） */
        .video-overlay {
            display: none; /* 初期は非表示 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* 動画本体：画面に収まる最大サイズ */
        .video-overlay video {
            max-width: 95vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            outline: none;
        }

        /* 動画を閉じるボタン */
        .close-btn {
            margin-top: 16px;
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            width: auto;
        }

        .close-btn:hover {
            background: #666;
        }

        @media (max-width: 480px) {
            .container { padding: 24px 16px; }
            h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>キーワードを入力してください</h1>
        
        <div class="input-group">
            <input type="text" id="keywordBlue" placeholder="！" autocomplete="off">
        </div>

        <div class="input-group">
            <input type="text" id="keywordYellow" placeholder="！" autocomplete="off">
        </div>

        <div class="input-group">
            <input type="text" id="keywordRed" placeholder="！" autocomplete="off">
        </div>

        <button onclick="checkKeywords()">！！！</button>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <!-- 全画面動画再生用オーバーレイ -->
    <div id="videoOverlay" class="video-overlay">
        <!-- dummy.mp4 を指定 -->
        <video id="bluffVideo" playsinline controls>
            <source src="Dummy.mp4" type="video/mp4">
            お使いのブラウザは動画再生に対応していません。
        </video>
        <button class="close-btn" onclick="closeVideo()">閉じる</button>
    </div>

    <script>
        function checkKeywords() {
            const kBlue = document.getElementById('keywordBlue').value;
            const kYellow = document.getElementById('keywordYellow').value;
            const kRed = document.getElementById('keywordRed').value;

            const errorMessage = document.getElementById('errorMessage');
            const videoOverlay = document.getElementById('videoOverlay');
            const bluffVideo = document.getElementById('bluffVideo');

            // 表示のリセット
            errorMessage.style.display = 'none';

            // ====== 設定部分 ======
            // 正解候補（配列）
            const correctBlue = ["軽音", "けいおん"];
            const correctYellow = "合宿";
            const correctRed = ["2026", "２０２６"];

            // ブラフ用キーワード（配列）
            const bluffWords = ["きおん", "超絶", "さけが　すき", "さけがすき", "解説"];

            // 正解時の遷移先URL
            const nextUrl = "quiz_page.html";
            // ======================

            const isBlueCorrect = correctBlue.includes(kBlue);
            const isYellowCorrect = correctYellow.includes(kYellow);
            const isRedCorrect = correctRed.includes(kRed);

            const isAllCorrect = isBlueCorrect && isYellowCorrect && isRedCorrect;
            const containsBluff = bluffWords.includes(kBlue) || bluffWords.includes(kYellow) || bluffWords.includes(kRed);

            if (isAllCorrect) {
                // 正解：指定のページへ移動
                window.location.href = nextUrl;

            } else if (containsBluff) {
                // ブラフ：全画面オーバーレイを表示して即時再生
                videoOverlay.style.display = 'flex';
                bluffVideo.currentTime = 0; // 毎回最初から再生

                // 動画を再生（「送信」ボタンを押したイベント直後なので音声付き再生が通りやすいです）
                bluffVideo.play().catch(error => {
                    // 自動再生ポリシーに引っかかった場合のフォールバック（消音にして再生）
                    bluffVideo.muted = true;
                    bluffVideo.play();
                });

            } else {
                // 不正解：警告表示
                errorMessage.textContent = "キーワードが正しくありません。";
                errorMessage.style.display = 'block';
            }
        }

        // 動画モーダルを閉じる処理
        function closeVideo() {
            const videoOverlay = document.getElementById('videoOverlay');
            const bluffVideo = document.getElementById('bluffVideo');

            bluffVideo.pause(); // 動画停止
            videoOverlay.style.display = 'none'; // 非表示化
        }
    </script>
</body>
</html>
