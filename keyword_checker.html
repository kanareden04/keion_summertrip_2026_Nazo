<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3つのキーワード入力</title>
    <style>
        /* 全体のスタイル（モノクローム・目に優しいダークトーン） */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* メインのコンテナ */
        .container {
            background-color: #2b2b2b;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #444;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 24px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        /* 入力エリアのグループ */
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
            margin-left: 2px;
        }

        /* 入力フィールド */
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #555;
            border-radius: 8px;
            background-color: #333;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #999;
        }

        /* 送信ボタン */
        button {
            background: linear-gradient(to bottom, #555, #444);
            color: #fff;
            border: 2px solid #666;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            transition: background 0.3s, border-color 0.3s;
        }

        button:hover {
            background: linear-gradient(to bottom, #666, #555);
            border-color: #888;
        }

        /* 警告メッセージ */
        .error-message {
            margin-top: 20px;
            padding: 12px;
            background-color: #4a4a4a;
            color: #ffffff;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }

        /* 動画コンテナ */
        .video-container {
            margin-top: 24px;
            display: none;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
        }

        iframe {
            display: block;
            width: 100%;
            height: 250px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>3つのキーワードを入力</h1>
        
        <div class="input-group">
            <label for="keyword1">キーワード 1</label>
            <input type="text" id="keyword1" placeholder="一つ目の言葉" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="keyword2">キーワード 2</label>
            <input type="text" id="keyword2" placeholder="二つ目の言葉" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="keyword3">キーワード 3</label>
            <input type="text" id="keyword3" placeholder="三つ目の言葉" autocomplete="off">
        </div>

        <button onclick="checkKeywords()">送信</button>

        <div id="errorMessage" class="error-message"></div>

        <div id="videoContainer" class="video-container">
            <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function checkKeywords() {
            // 3つの入力値を取得（余計な空白を除去）
            const k1 = document.getElementById('keyword1').value.trim();
            const k2 = document.getElementById('keyword2').value.trim();
            const k3 = document.getElementById('keyword3').value.trim();

            const errorMessage = document.getElementById('errorMessage');
            const videoContainer = document.getElementById('videoContainer');
            const videoPlayer = document.getElementById('videoPlayer');

            // 表示のリセット
            errorMessage.style.display = 'none';
            videoContainer.style.display = 'none';
            videoPlayer.src = "";

            // ====== 設定部分 ======
            // 各入力欄の正解を設定
            const correct1 = "りんご";
            const correct2 = "みかん";
            const correct3 = "ぶどう";

            // ブラフの判定用ワード（どの入力欄に打たれても反応させたい場合）
            const bluffWords = ["ダミー", "トラップ", "ひっかけ"];

            // 遷移先のページ名やURL
            const nextUrl = "quiz_page.html";

            // ブラフ動画の埋め込みURL
            const bluffVideoUrl = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
            // ======================

            // 入力されたワードの中にブラフが含まれているか確認
            const containsBluff = bluffWords.includes(k1) || bluffWords.includes(k2) || bluffWords.includes(k3);

            // すべて正解しているか確認
            const isAllCorrect = (k1 === correct1) && (k2 === correct2) && (k3 === correct3);

            if (isAllCorrect) {
                // 1. 3つとも正解の場合：指定したページへ移動
                window.location.href = nextUrl;

            } else if (containsBluff) {
                // 2. 1つでもブラフ用ワードが含まれている場合：動画を再生
                videoPlayer.src = bluffVideoUrl;
                videoContainer.style.display = 'block';

            } else {
                // 3. それ以外（間違っている場合）：警告メッセージを表示
                errorMessage.textContent = "キーワードが正しくありません。";
                errorMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
