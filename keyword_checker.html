<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーワード入力</title>
    <style>
        /* 全体のスタイル（モノクローム・目に優しいダークトーン） */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* メインのコンテナ */
        .container {
            background-color: #2b2b2b;
            padding: 40px;
            border-radius: 12px; /* 少し丸みを帯びた角 */
            border: 2px solid #444; /* やや太めの枠線 */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 24px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        /* 入力フィールド */
        input[type="text"] {
            width: calc(100% - 32px);
            padding: 14px;
            margin-bottom: 20px;
            border: 2px solid #555;
            border-radius: 8px;
            background-color: #333;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #999;
        }

        /* ボタン（上下でわずかにグラデーションをつけ、立体感を演出） */
        button {
            background: linear-gradient(to bottom, #555, #444);
            color: #fff;
            border: 2px solid #666;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
        }

        button:hover {
            background: linear-gradient(to bottom, #666, #555);
            border-color: #888;
        }

        /* 警告メッセージ（赤などは使わず、グレー背景と白文字で表現） */
        .error-message {
            margin-top: 20px;
            padding: 10px;
            background-color: #4a4a4a;
            color: #ffffff;
            border-radius: 6px;
            font-weight: bold;
            display: none; /* 初期状態は非表示 */
        }

        /* 動画コンテナ */
        .video-container {
            margin-top: 24px;
            display: none; /* 初期状態は非表示 */
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
        }

        iframe {
            display: block;
            width: 100%;
            height: 250px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>キーワードを入力してください</h1>
        
        <input type="text" id="keywordInput" placeholder="キーワード" autocomplete="off">
        <br>
        <button onclick="checkKeyword()">送信</button>

        <div id="errorMessage" class="error-message"></div>

        <div id="videoContainer" class="video-container">
            <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function checkKeyword() {
            // 入力された文字を取得し、前後の空白を削除
            const input = document.getElementById('keywordInput').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const videoContainer = document.getElementById('videoContainer');
            const videoPlayer = document.getElementById('videoPlayer');

            // 判定前のリセット処理
            errorMessage.style.display = 'none';
            videoContainer.style.display = 'none';
            videoPlayer.src = "";

            // ====== 設定部分 ======
            const correctAnswer = "クイズ"; // 正解のキーワード
            const bluffAnswer = "ダミー"; // ブラフのキーワード
            const nextUrl = "quiz_page.html"; // 正解時に移動するURL
            // ブラフ時に流す動画のURL（例としてYouTubeの埋め込み用URL）
            const bluffVideoUrl = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"; 
            // ======================

            if (input === correctAnswer) {
                // 正解のキーワードの場合：指定したページへ移動
                window.location.href = nextUrl;
                
            } else if (input === bluffAnswer) {
                // ブラフのキーワードの場合：動画を表示して再生
                videoPlayer.src = bluffVideoUrl;
                videoContainer.style.display = 'block';
                
            } else {
                // 関係ないワードの場合：警告メッセージを表示
                errorMessage.textContent = "入力されたキーワードが間違っています。";
                errorMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
