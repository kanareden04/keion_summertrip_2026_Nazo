<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乗ってきたバスを呼び戻せ</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, 'ヒラギノ角ゴ ProN', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            background-color: #2b2b2b;
            padding: 36px 20px;
            border-radius: 12px;
            border: 2px solid #444;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 28px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #ffffff;
        }

        /* ナンバープレートデザイン */
        .license-plate {
            background-color: #006B3C;
            border: 4px solid #d0d5dd;
            border-radius: 12px;
            padding: 24px 14px 20px 14px;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.2), 0 6px 16px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }

        .plate-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-size: 20px;
            font-weight: bold;
            color: #FAFAFA;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .plate-body {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .plate-kana {
            font-size: 30px;
            font-weight: bold;
            color: #FAFAFA;
            line-height: 1;
            flex-shrink: 0;
        }

        .number-inputs {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hyphen {
            font-size: 24px;
            font-weight: bold;
            color: #FAFAFA;
            margin: 0 2px;
            flex-shrink: 0;
        }

        /* プルダウン（select）のスタイル調整 */
        .num-select {
            width: 48px;
            height: 56px;
            background-color: #006B3C;
            border: 2px solid #88ba9e;
            border-radius: 6px;
            color: #FAFAFA;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            text-align-last: center; /* 中央寄せ（Chrome/Safari） */
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none; /* デフォルトの矢印アイコンを消去 */
            -webkit-appearance: none;
            -moz-appearance: none;
            padding: 0;
            box-sizing: border-box;
        }

        /* プルダウンの選択肢（展開時）の背景と文字色 */
        .num-select option {
            background-color: #2b2b2b;
            color: #ffffff;
            font-size: 18px;
        }

        .num-select:focus {
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .num-select:disabled {
            background-color: #1a432b;
            color: #888888;
            border-color: #2d5a3f;
            cursor: not-allowed;
        }

        button {
            background: linear-gradient(to bottom, #555, #444);
            color: #fff;
            border: 2px solid #666;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s, border-color 0.3s;
            box-sizing: border-box;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            background: linear-gradient(to bottom, #666, #555);
            border-color: #888;
        }

        button:disabled {
            background: #333;
            color: #777;
            border-color: #444;
            cursor: not-allowed;
        }

        .error-message {
            margin-top: 20px;
            padding: 12px;
            background-color: #4a4a4a;
            color: #ffffff;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }

        @media (max-width: 400px) {
            .container { padding: 24px 12px; }
            .license-plate { padding: 16px 8px; }
            .plate-body { gap: 4px; }
            .num-select { width: 38px; height: 48px; font-size: 20px; }
            .plate-kana { font-size: 24px; }
            .plate-header { font-size: 18px; gap: 12px; }
            .hyphen { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>乗ってきたバスを呼び戻せ</h1>

        <div class="license-plate">
            <div class="plate-header">
                <span>岡崎</span>
                <span>200</span>
            </div>

            <div class="plate-body">
                <span class="plate-kana">か</span>
                <div class="number-inputs">
                    <!-- 1桁目 -->
                    <select class="num-select" id="digit1">
                        <option value="・">・</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                    </select>

                    <!-- 2桁目 -->
                    <select class="num-select" id="digit2">
                        <option value="・">・</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                    </select>

                    <span class="hyphen">-</span>

                    <!-- 3桁目 -->
                    <select class="num-select" id="digit3">
                        <option value="・">・</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                    </select>

                    <!-- 4桁目 -->
                    <select class="num-select" id="digit4">
                        <option value="・">・</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                    </select>
                </div>
            </div>
        </div>

        <button id="submitBtn" onclick="checkNumber()">呼び戻す</button>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        // ====== 設定部分 ======
        // 4文字で設定します（空欄指定には「・」を使います）
        // 例: 「・643」や「・・43」、「1234」など
        const correctNumber = "・643"; 
        
        const nextUrl = "clear_page.html";
        const failureUrl = "failure_page.html";
        // ======================

        const selects = [
            document.getElementById('digit1'),
            document.getElementById('digit2'),
            document.getElementById('digit3'),
            document.getElementById('digit4')
        ];
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');

        function checkNumber() {
            // 4つの選択値を結合して確認（例: "・" + "6" + "4" + "3" => "・643"）
            const enteredNumber = selects.map(select => select.value).join('');

            if (enteredNumber === correctNumber) {
                window.location.href = nextUrl;
            } else {
                window.location.href = failureUrl;
            }
        }

        function disableForm() {
            selects.forEach(select => {
                select.disabled = true;
            });
            submitBtn.disabled = true;
        }
    </script>
</body>
</html>
