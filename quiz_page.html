<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乗ってきたバスを呼び戻せ</title>
    <style>
        /* 全体のスタイル（暗めの落ち着いた背景） */
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, 'ヒラギノ角ゴ ProN', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        /* メインコンテナ */
        .container {
            background-color: #2b2b2b;
            padding: 36px 24px;
            border-radius: 12px;
            border: 2px solid #444;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 28px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #ffffff;
        }

        /* ナンバープレート風プレート */
        .license-plate {
            background-color: #22252a;
            border: 4px solid #444950;
            border-radius: 10px;
            padding: 20px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8), 0 4px 12px rgba(0,0,0,0.3);
            margin-bottom: 24px;
            position: relative;
        }

        /* プレート上部（地名 ＋ 分類番号） */
        .plate-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-size: 20px;
            font-weight: bold;
            color: #b0b8c0;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        /* プレートメイン部分（ひらがな ＋ 4桁数字入力） */
        .plate-body {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* 左側のひらがな */
        .plate-kana {
            font-size: 32px;
            font-weight: bold;
            color: #4a90e2;
            line-height: 1;
            padding-right: 6px;
        }

        /* 4桁の入力欄コンテナ */
        .number-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ハイフン */
        .hyphen {
            font-size: 24px;
            font-weight: bold;
            color: #666;
            margin: 0 2px;
        }

        /* 独立した各桁の数字入力欄 */
        .num-box {
            width: 44px;
            height: 56px;
            background-color: #121315;
            border: 2px solid #555;
            border-radius: 6px;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -moz-appearance: textfield;
        }

        .num-box::-webkit-outer-spin-button,
        .num-box::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .num-box:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.4);
            background-color: #181a1e;
        }

        /* 無効化（入力不可）時の見た目 */
        .num-box:disabled {
            background-color: #222;
            color: #666;
            border-color: #333;
            cursor: not-allowed;
        }

        /* 呼び戻す（送信）ボタン */
        button {
            background: linear-gradient(to bottom, #555, #444);
            color: #fff;
            border: 2px solid #666;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s, border-color 0.3s;
            box-sizing: border-box;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            background: linear-gradient(to bottom, #666, #555);
            border-color: #888;
        }

        button:disabled {
            background: #333;
            color: #777;
            border-color: #444;
            cursor: not-allowed;
        }

        /* 警告メッセージ（消去ボタンなし） */
        .error-message {
            margin-top: 20px;
            padding: 12px;
            background-color: #4a4a4a;
            color: #ffffff;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }

        @media (max-width: 480px) {
            .container { padding: 24px 16px; }
            .license-plate { padding: 16px 10px; }
            .num-box { width: 38px; height: 50px; font-size: 24px; }
            .plate-kana { font-size: 26px; }
            .plate-header { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>乗ってきたバスを呼び戻せ</h1>

        <div class="license-plate">
            <div class="plate-header">
                <span>品川</span>
                <span>200</span>
            </div>

            <div class="plate-body">
                <span class="plate-kana">さ</span>
                <div class="number-inputs">
                    <input type="number" class="num-box" id="digit1" min="0" max="9" pattern="\d*" inputmode="numeric" autocomplete="off">
                    <input type="number" class="num-box" id="digit2" min="0" max="9" pattern="\d*" inputmode="numeric" autocomplete="off">
                    <span class="hyphen">-</span>
                    <input type="number" class="num-box" id="digit3" min="0" max="9" pattern="\d*" inputmode="numeric" autocomplete="off">
                    <input type="number" class="num-box" id="digit4" min="0" max="9" pattern="\d*" inputmode="numeric" autocomplete="off">
                </div>
            </div>
        </div>

        <button id="submitBtn" onclick="checkNumber()">呼び戻す</button>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        // ====== 設定部分 ======
        const correctNumber = "1234"; // 4桁の正解ナンバー
        const nextUrl = "clear_page.html"; // クリア後の遷移先URL
        // ======================

        const inputs = [
            document.getElementById('digit1'),
            document.getElementById('digit2'),
            document.getElementById('digit3'),
            document.getElementById('digit4')
        ];
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');

        // 入力補助処理
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (input.value.length > 1) {
                    input.value = input.value.slice(-1);
                }
                if (input.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // 判定処理
        function checkNumber() {
            const enteredNumber = inputs.map(input => input.value).join('');

            // 4桁未満の入力チェック
            if (enteredNumber.length < 4) {
                errorMessage.textContent = "4桁の数字をすべて入力してください。";
                errorMessage.style.display = 'block';
                return;
            }

            if (enteredNumber === correctNumber) {
                // 正解：ページ移動
                window.location.href = nextUrl;"clear_page.html"
            } else {
                // 不正解：入力欄とボタンを無効化し、閉じられないメッセージを表示
                disableForm();
                errorMessage.textContent = "そのナンバーのバスが見当たりません。あなたは帰れなくなりました。";
                errorMessage.style.display = 'block';
            }
        }

        // 入力欄とボタンを無効化（その場での修正を不可能にする）関数
        function disableForm() {
            inputs.forEach(input => {
                input.disabled = true;
            });
            submitBtn.disabled = true;
        }
    </script>
</body>
</html>
